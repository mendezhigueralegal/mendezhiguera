<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Méndez Higuera Legal Group | Servicios Jurídicos España y Colombia</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ==========================================
           VARIABLES Y CONFIGURACIÓN GLOBAL
           ========================================== */
        :root {
            --primary-navy: #0f1e36;
            --accent-gold: #c5a059;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --text-dark: #1a1a1a;
            --text-muted: #555555;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: all 0.3s ease;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-dark);
            line-height: 1.6;
            background-color: var(--white);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ==========================================
           ENCABEZADOS Y NAVEGACIÓN CENTRADA
           ========================================== */
        .header {
            background-color: rgba(15, 30, 54, 0.96);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 18px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            backdrop-filter: blur(8px);
        }

        .nav-container-centered {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 45px;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        /* ==========================================
           SECCIÓN HERO (PORTADA CON CARRUSEL DE FONDO)
           ========================================== */
        .hero-section {
            position: relative;
            padding: 70px 0 90px 0;
            text-align: center;
            color: var(--white);
            overflow: hidden;
            min-height: 85vh;
            display: flex;
            align-items: center;
        }

        /* CARRUSEL ANIMADO EN CSS */
        .hero-carousel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: imageFade 21s infinite ease-in-out;
        }

        /* Slide 1: Enfoque Médico / Homologación */
        .slide-1 {
            background-image: url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1920&q=80');
            animation-delay: 0s;
        }

        /* Slide 2: Extranjería y Arquitectura Corporativa */
        .slide-2 {
            background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80');
            animation-delay: 7s;
        }

        /* Slide 3: Consultoría Jurídica y Tributaria */
        .slide-3 {
            background-image: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&q=80');
            animation-delay: 14s;
        }

        @keyframes imageFade {
            0% { opacity: 0; transform: scale(1); }
            8% { opacity: 1; }
            33% { opacity: 1; }
            41% { opacity: 0; transform: scale(1.04); }
            100% { opacity: 0; }
        }

        /* OVERLAY OSCURO PARA LEGIBILIDAD */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(15, 30, 54, 0.92) 0%, rgba(15, 30, 54, 0.82) 50%, rgba(15, 30, 54, 0.95) 100%);
            z-index: 2;
        }

        /* CONTENIDO HERO Y CONTROL DEL LOGO */
        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-logo-box {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        /* CONTROL ESTRICTO DE LA IMAGEN DEL LOGO */
        .hero-logo-img {
            height: 160px !important;
            width: auto !important;
            max-width: 320px !important;
            object-fit: contain !important;
            filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.4));
            display: block !important;
        }

        .hero-subtitle {
            color: var(--accent-gold);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 18px;
            display: block;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 2.7rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 22px;
        }

        .hero-description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.88);
            max-width: 750px;
            margin: 0 auto 38px auto;
            font-weight: 300;
        }

            display: flex;
            justify
