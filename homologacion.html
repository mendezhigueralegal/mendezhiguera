<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Viabilidad | Méndez Higuera Legal Group</title>
    
    <!-- Tipografías de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-navy: #0f1e36;
            --accent-gold: #c5a059;
            --white: #ffffff;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--primary-navy);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* CABECERA CON LOGO */
        .header {
            background-color: rgba(15, 30, 54, 0.98);
            padding: 12px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .header-logo {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .header-spacer {
            width: 120px; /* Mantiene el logo perfectamente centrado */
        }

        /* CONTENEDOR DEL FORMULARIO */
        .tally-wrapper {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tally-card {
            background-color: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            .header-spacer {
                display: none;
            }
            .tally-wrapper {
                margin: 20px auto;
                padding: 0 10px;
            }
        }
    </style>

    <!-- SCRIPT OFICIAL DE TALLY -->
    <script async src="https://tally.so/widgets/embed.js"></script>
</head>
<body>

    <!-- BARRA SUPERIOR DE NAVEGACIÓN -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="back-link">&larr; Volver al Inicio</a>
            <img src="logo.png" alt="Méndez Higuera Legal Group" class="header-logo">
            <div class="header-spacer"></div>
        </div>
    </header>

    <!-- FORMULARIO TALLY EN CONTENEDOR BLANCO LEGIBLE -->
    <main class="tally-wrapper">
        <div class="tally-card">
            <iframe 
                data-tally-src="https://tally.so/embed/BzVKWe?alignLeft=1&hideTitle=0&dynamicHeight=1" 
                loading="lazy" 
                width="100%" 
                height="800" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0" 
                title="Evaluación de Viabilidad Homologación Médica">
            </iframe>
        </div>
    </main>

</body>
</html>
