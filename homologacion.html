<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-navy: #0f1e36;
            --accent-gold: #c5a059;
            --white: #ffffff;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--primary-navy);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* CABECERA DE LA SUBPÁGINA */
        .header {
            background-color: rgba(15, 30, 54, 0.98);
            padding: 18px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            text-align: center;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .page-title {
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--white);
        }

        /* CONTENEDOR DEL FORMULARIO TALLY */
        .tally-container {
            flex: 1;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 80vh;
            border: none;
        }
    </style>

    <script async src="https://tally.so/widgets/embed.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="back-link">&larr; Volver al Inicio</a>
            <span class="page-title">Méndez Higuera Legal Group</span>
            <div style="width: 100px;"></div> </div>
    </header>

    <main class="tally-container">
        <iframe 
            data-tally-src="https://tally.so/embed/BzVKWe?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" 
            loading="lazy" 
            width="100%" 
            height="100%" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0" 
            title="Viabilidad Homologación Médica">
        </iframe>
    </main>
