<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - 404</title>
    <!-- Vincula aquí tu CSS principal para mantener la línea gráfica -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            margin: 0;
            color: #333; /* Ajusta con tu color primario */
        }

        .error-title {
            font-size: 1.8rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            color: #555;
        }

        .error-description {
            max-width: 480px;
            margin-bottom: 2rem;
            color: #666;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            background-color: #0066cc; /* Color del botón de tu marca */
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn-home:hover {
            background-color: #004999;
        }
    </style>
</head>
<body>

    <main class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-description">
            Lo sentimos, la página que estás buscando no existe, ha sido movida o la dirección ingresada es incorrecta.
        </p>
        <a href="index.html" class="btn-home">Volver al inicio</a>
    </main>

</body>
</html>
